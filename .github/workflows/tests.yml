name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer les dépendances
        run: uv sync

      - name: Vérifier le style (ruff)
        run: uv run ruff check .

      - name: Vérifier que le code compile
        run: uv run python -m compileall -q src

      - name: Lancer les tests avec couverture (min 60 %)
        run: uv run pytest --cov=src --cov-fail-under=60